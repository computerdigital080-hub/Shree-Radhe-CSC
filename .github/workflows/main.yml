name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build APK
        run: |
          mkdir -p src/com/example/webviewapp res/layout res/values build/outputs/apk bin

          # 1. AndroidManifest
          cat << 'EOF' > AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              package="com.example.webviewapp">
              <uses-permission android:name="android.permission.INTERNET" />
              <application android:label="SRCSC" android:supportsRtl="true">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          # 2. Layout
          cat << 'EOF' > res/layout/activity_main.xml
          <?xml version="1.0" encoding="utf-8"?>
          <RelativeLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent">
              <WebView
                  android:id="@+id/webview"
                  android:layout_width="match_parent"
                  android:layout_height="match_parent" />
          </RelativeLayout>
          EOF

          # 3. Java Source
          cat << 'EOF' > src/com/example/webviewapp/MainActivity.java
          package com.example.webviewapp;

          import android.app.Activity;
          import android.os.Bundle;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          public class MainActivity extends Activity {
              private WebView webView;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  setContentView(R.layout.activity_main);

                  webView = findViewById(R.id.webview);
                  WebSettings webSettings = webView.getSettings();
                  webSettings.setJavaScriptEnabled(true);
                  webSettings.setDomStorageEnabled(true);
                  
                  webView.setWebViewClient(new WebViewClient());
                  webView.loadUrl("https://studentsrcsc.blogspot.com/");
              }

              @Override
              public void onBackPressed() {
                  if (webView.canGoBack()) {
                      webView.goBack();
                  } else {
                      super.onBackPressed();
                  }
              }
          }
          EOF

          # 4. Compile Resources & Code
          AAPT=$ANDROID_HOME/build-tools/33.0.0/aapt
          D8=$ANDROID_HOME/build-tools/33.0.0/d8
          PLATFORM=$ANDROID_HOME/platforms/android-33/android.jar

          $AAPT package -f -m -J src -M AndroidManifest.xml -S res -I $PLATFORM
          javac -classpath $PLATFORM -d bin $(find src -name "*.java")
          $D8 --output bin bin/com/example/webviewapp/*.class
          
          $AAPT package -f -M AndroidManifest.xml -S res -I $PLATFORM -F build/outputs/apk/app-unsigned.apk .
          
          cd build/outputs/apk
          $AAPT add app-unsigned.apk ../../../bin/classes.dex
          
          keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android,O=Android,C=US"
          $ANDROID_HOME/build-tools/33.0.0/apksigner sign --ks debug.keystore --ks-pass pass:android app-unsigned.apk
          mv app-unsigned.apk app-release.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/outputs/apk/app-release.apk
